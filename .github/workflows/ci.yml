name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Type-check (astro check)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
