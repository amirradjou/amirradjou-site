<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #ffffff;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: #1b1f24;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .bar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 18px;
        background: #1f3a5f;
      }
      .name {
        font-size: 88px;
        font-weight: 750;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 0;
      }
      .title {
        font-size: 36px;
        font-weight: 500;
        color: #1f3a5f;
        margin: 22px 0 0;
      }
      .meta {
        font-size: 30px;
        color: #5b6470;
        margin: 18px 0 0;
      }
      .url {
        position: absolute;
        right: 96px;
        bottom: 72px;
        font-size: 30px;
        color: #5b6470;
      }
      .mark {
        position: absolute;
        left: 96px;
        bottom: 64px;
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: #1f3a5f;
        color: #fff;
        font-weight: 700;
        font-size: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bar"></div>
      <h1 class="name">Amirreza Radjou</h1>
      <p class="title">Software Engineer — Backend &amp; Distributed Systems</p>
      <p class="meta">Senior Full Stack Developer at CIBC · Toronto, ON</p>
      <div class="mark">AR</div>
      <div class="url">amirradjou.com</div>
    </div>
  </body>
</html>
